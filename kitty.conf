# Kitty configuration migrated from .hyper.js

# Font
font_family Fira Code Medium
font_size 14

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Shell
shell zsh

# New tabs in current working directory
map cmd+t launch --type=tab --cwd=current

# Fading scrollbar
scrollbar_hiding_period 3

# Gruvbox Dark theme
# https://github.com/dexpota/kitty-gruvbox
foreground            #ebdbb2
background            #282828
selection_foreground  #ebdbb2
selection_background  #3c3836
cursor                #ebdbb2
cursor_text_color     #282828

# black
color0                #282828
color8                #928374

# red
color1                #cc241d
color9                #fb4934

# green
color2                #98971a
color10               #b8bb26

# yellow
color3                #d79921
color11               #fabd2f

# blue
color4                #458588
color12               #83a598

# magenta
color5                #b16286
color13               #d3869b

# cyan
color6                #689d6a
color14               #8ec07c

# white
color7                #a89984
color15               #ebdbb2
