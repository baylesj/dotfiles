# Kitty configuration migrated from .hyper.js

# Font
font_family Fira Code Retina
font_size 14

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Shell
shell zsh

# New tabs in current working directory
map cmd+t launch --type=tab --cwd=current

# Fading scrollbar
scrollbar_hiding_period 3

# Separate theme file
include ./theme.conf


# BEGIN_KITTY_THEME
# Gruvbox Dark Soft
include current-theme.conf
# END_KITTY_THEME