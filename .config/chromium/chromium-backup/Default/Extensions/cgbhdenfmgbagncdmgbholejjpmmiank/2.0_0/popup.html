<!doctype html>
<html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
<title>YouTube™ Ratings Preview configuration</title>
<link rel="stylesheet" href="style.css" type="text/css" />
<script src="popup.js"></script>
</head>
<body style="width: 360px;">

<div style="font-family :Arial,sans-serif; font-size:16px; font-weight:500;">
<img src="icon48.png" alt="icon" width="48px" height="48px" />
<p style="position:absolute; top:5px; left:68px;">YouTube™ Ratings Preview configuration</p>
</div>
<hr />

<div style="font-family :Arial,sans-serif; font-size:13px; font-weight:500;">

<div>
Bar thickness:&nbsp;&nbsp;
<input id="range_thickness" type="range" min="3" max="8" value="5" step="1" style="position:relative; top:6px; width:100px;" />
<label id="label_thickness">&nbsp;&nbsp;5 pixels</label>
<br />
<span style="position:relative; top:5px; color:gray;">Preview:</span>
<div style="position:relative; bottom:6px; height:8px;"><div class="ytrp_rb_bg ytrp_rb_bg_bottom" title="95.67% likes (947 ratings)" style="position:absolute; left:54px; bottom:0px; width:120px;"><div class="ytrp_rb_fg ytrp_rb_fg_like" style="width: 113px;"></div><div class="ytrp_rb_fg ytrp_rb_fg_dislike" style="width: 6px;"></div></div></div>
</div>

<div>
Highlighted videos:&nbsp;&nbsp;
<input id="range_highlighted" type="range" min="0" max="8" value="3" step="1" style="position:relative; top:6px; width:100px;" />
<label id="label_highlighted">&nbsp;&nbsp;3 videos</label>
<br />
<span style="position:relative; top:5px; color:gray;">Best videos in every page will show a blue box around them</span>
</div>

<div style="position:relative; top:8px;">
Caching:&nbsp;&nbsp;
<input id="range_caching" type="range" min="0" max="7" value="3" step="1" style="position:relative; top:6px; width:100px;" />
<label id="label_caching">&nbsp;&nbsp;1 hour</label>
<br />
<span style="position:relative; top:5px; color:gray;" title="The cache is deleted when you close Google Chrome">Cached bars load faster but display outdated data</span>
</div>

<br />
<hr />

<div><strong>
<label id="label_donate" style="font-size:17px; color:#060; cursor:pointer;">Do you find this extension useful? <span style="color:#C00;">Click here!</span></label>
</strong></div>

</div>

</body>
</html>
