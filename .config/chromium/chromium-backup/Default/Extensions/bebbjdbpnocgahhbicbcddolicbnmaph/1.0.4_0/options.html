<html>
<head>
	<title>Google Images Search > Options Page</title>
	<style type="text/css">
		#languages {
			top: 0px;
			left: 0px;
		}
		
		.state {
			margin-left: 5px;
			font-family: verdana;
			font-size: 10px;
			color: green;
			font-weight: normal;
			display: none;
		}
		
		span {
			font-family: verdana;
			font-weight: bold;
			font-size: 12px;
		}
		
		label {
			cursor: pointer;
			font-family: verdana;
			font-size: 10px;
			color: black;
		}
	</style>
	<script type="text/javascript" src="jquery-1.4.2.min.js"></script>
	<script type="text/javascript">
		$(document).ready(
			function() {
				init();
				$("input").click(
					function() {
						var kind = $(this).attr("name");
						$("#"+localStorage[kind]).next().css("font-weight","normal");
						localStorage[kind] = $(this).attr("id");
						var temp = this;
						$(temp).next().next().fadeIn(
							"fast",
							function() {
								$(temp).next().next().fadeOut("normal");
							}
						);
						$(this).next().css("font-weight","bold");
					}
				);
			}
		);
		function init() {
			/* Restore languges */
			var languages = ["en","English","de","German","fr","French","zh-TW","Chinese (Traditional)","zh-CN","Chinese (Simplified)","it","Italian","ja","Japanese","ko","Korean","pt","Portuguese","ru","Russian","es","Spanish","cs","Czech"];
			var container = document.getElementById("language");
			for(var i = 0; i < (languages.length/2); i++) {
				var checked = languages[i*2] == localStorage["language"] ? "checked"	: "";
				var bold		= languages[i*2] == localStorage["language"] ? "bold"			: "normal";
				container.innerHTML += '<input '+ checked +' name="language" type="radio" id="'+ languages[i*2] +'"><label style="font-weight:'+ bold +'" for="'+ languages[i*2] +'">'+ languages[i*2+1] +'</label><span class="state">saved</span><br>';
			}
			
			/* Restore load effect */
			$("#"+localStorage["effect"]).attr("checked", true);
			$("#"+localStorage["effect"]).next().css("font-weight", "bold");
		}
	</script>
</head>
<body>
<span>Load effect</span><br>
<div>
	<input name="effect" type="radio" id="effect_on"><label for="effect_on">ON</label><span class="state">saved</span><br>
	<input name="effect" type="radio" id="effect_off"><label for="effect_off">OFF</label><span class="state">saved</span><br>
</div>
<span>Language</span><br>
<div id="language"></div>
</body>
</html>
